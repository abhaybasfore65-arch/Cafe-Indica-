<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Indica - Order Online</title>
    <style>
        :root {
            --primary-green: #1a3c1a;
            --light-bg: #fdfdfd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px; /* Cart ke liye space */
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 { color: var(--primary-green); margin: 0; text-transform: uppercase; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .category h2 {
            color: var(--primary-green);
            border-bottom: 1px solid #ddd;
            font-size: 20px;
            margin-top: 25px;
        }

        /* Item Row Styling */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dotted #ccc;
        }

        .item-info { flex: 1; }
        .item-name { font-weight: 500; display: block; }
        .item-price { color: #666; font-size: 14px; }

        /* Plus Minus Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .btn-qty {
            background: var(--primary-green);
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-val { font-weight: bold; min-width: 15px; text-align: center; }

        /* Floating Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: var(--primary-green);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none; /* Initially hidden */
            z-index: 1000;
        }

        .order-now-btn {
            background: white;
            color: var(--primary-green);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1>Cafe Indica</h1>
        <p>Deliciously Yours</p>
    </header>

    <div class="menu-grid" id="menu-content">
        <div class="column">
            <div class="category">
                <h2>TEA & COFFEE</h2>
                <div class="menu-item" data-name="Milk Tea" data-price="29">
                    <div class="item-info">
                        <span class="item-name">Milk Tea</span>
                        <span class="item-price">₹29</span>
                    </div>
                    <div class="controls">
                        <button class="btn-qty minus">-</button>
                        <span class="qty-val">0</span>
                        <button class="btn-qty plus">+</button>
                    </div>
                </div>
                <div class="menu-item" data-name="Cold Coffee" data-price="69">
                    <div class="item-info"><span class="item-name">Cold Coffee</span><span class="item-price">₹69</span></div>
                    <div class="controls"><button class="btn-qty minus">-</button><span class="qty-val">0</span><button class="btn-qty plus">+</button></div>
                </div>
            </div>

            <div class="category">
                <h2>BURGER & MAGGIE</h2>
                <div class="menu-item" data-name="Veg Burger" data-price="59">
                    <div class="item-info"><span class="item-name">Veg Burger</span><span class="item-price">₹59</span></div>
                    <div class="controls"><button class="btn-qty minus">-</button><span class="qty-val">0</span><button class="btn-qty plus">+</button></div>
                </div>
                <div class="menu-item" data-name="Cheese Maggie" data-price="59">
                    <div class="item-info"><span class="item-name">Cheese Maggie</span><span class="item-price">₹59</span></div>
                    <div class="controls"><button class="btn-qty minus">-</button><span class="qty-val">0</span><button class="btn-qty plus">+</button></div>
                </div>
            </div>
        </div>

        <div class="column">
            <div class="category">
                <h2>SNACKS & COMBOS</h2>
                <div class="menu-item" data-name="French Fries" data-price="59">
                    <div class="item-info"><span class="item-name">French Fries</span><span class="item-price">₹59</span></div>
                    <div class="controls"><button class="btn-qty minus">-</button><span class="qty-val">0</span><button class="btn-qty plus">+</button></div>
                </div>
                <div class="menu-item" data-name="Combo 1" data-price="149">
                    <div class="item-info"><span class="item-name">Combo 1 (Burger+Fries)</span><span class="item-price">₹149</span></div>
                    <div class="controls"><button class="btn-qty minus">-</button><span class="qty-val">0</span><button class="btn-qty plus">+</button></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="cart-bar" id="cartBar">
    <div>
        <span id="totalItems">0</span> Items | <span id="totalPrice">₹0</span>
    </div>
    <button class="order-now-btn" onclick="sendWhatsApp()">Order on WhatsApp &rarr;</button>
</div>

<script>
    let cart = {};
    const whatsappNumber = "918697781622";

    document.querySelectorAll('.btn-qty').forEach(button => {
        button.addEventListener('click', function() {
            const itemElement = this.closest('.menu-item');
            const name = itemElement.getAttribute('data-name');
            const price = parseInt(itemElement.getAttribute('data-price'));
            const qtyDisplay = itemElement.querySelector('.qty-val');
            
            if (!cart[name]) cart[name] = { price: price, qty: 0 };

            if (this.classList.contains('plus')) {
                cart[name].qty++;
            } else if (this.classList.contains('minus') && cart[name].qty > 0) {
                cart[name].qty--;
            }

            qtyDisplay.innerText = cart[name].qty;
            updateCartBar();
        });
    });

    function updateCartBar() {
        let totalQty = 0;
        let totalPrice = 0;

        for (let key in cart) {
            totalQty += cart[key].qty;
            totalPrice += (cart[key].qty * cart[key].price);
        }

        const cartBar = document.getElementById('cartBar');
        if (totalQty > 0) {
            cartBar.style.display = 'flex';
            document.getElementById('totalItems').innerText = totalQty;
            document.getElementById('totalPrice').innerText = '₹' + totalPrice;
        } else {
            cartBar.style.display = 'none';
        }
    }

    function sendWhatsApp() {
        let message = "Hello Cafe Indica, I want to order:\n\n";
        let grandTotal = 0;

        for (let key in cart) {
            if (cart[key].qty > 0) {
                let itemTotal = cart[key].qty * cart[key].price;
                message += `✅ ${key} x ${cart[key].qty} = ₹${itemTotal}\n`;
                grandTotal += itemTotal;
            }
        }

        message += `\n*Total Amount: ₹${grandTotal}*`;
        
        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
    }
</script>

</body>
</html>
